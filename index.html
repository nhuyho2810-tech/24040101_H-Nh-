<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Introduction</title>
  <style>
    :root { color-scheme: light; --ink: #243047; --muted: #65728a; --accent: #5575d8; --paper: #ffffff; --bg: #f2f5fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 48px 20px; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: min(720px, 100%); margin: 0 auto; }
    header { margin-bottom: 24px; text-align: center; }
    .eyebrow { margin: 0 0 8px; color: var(--accent); font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.15; }
    .intro { margin: 12px 0 0; color: var(--muted); }
    .card { display: grid; gap: 16px; padding: 24px; border: 1px solid #e3e8f2; border-radius: 20px; background: var(--paper); box-shadow: 0 12px 32px #23345412; }
    section { padding: 18px 20px; border-radius: 14px; background: #f8f9fd; }
    h2 { margin: 0 0 6px; font-size: 1rem; }
    section p { margin: 0; color: var(--muted); }
    @media (min-width: 600px) { .card { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Personal profile</p>
      <h1>Hồ Như Ý</h1>
      <p class="intro">A short introduction</p>
    </header>
    <div class="card">
      <section>
        <h2>Major</h2>
        <p>Quan Hệ Công Chúng</p>
      </section>
      <section>
        <h2>Skills</h2>
        <p>Làm nội dung, thuyết trình</p>
      </section>
      <section>
        <h2>Career goals</h2>
        <p>Kinh doanh, tạo clip</p>
      </section>
    </div>
  </main>
</body>
</html>
